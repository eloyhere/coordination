# Native C functions.
#
# `coorc` reads the compiler, target, flags and native inputs from this project
# file; the `.coo` source only declares the header and ABI with @Native. The
# native sources are built by the project itself (native/build.cmd or
# native/build.sh) - coorc never compiles user `.c`/`.cpp` files.
#
# For Linux/macOS replace [build].target, [toolchain.<target>] and the object
# extension below with the host values (see native/build.sh).

[package]
name = "native_c_functions"
version = "0.1.0"
edition = "2026"
source = "src"

[build]
target = "x86_64-pc-windows-msvc"

[toolchain.x86_64-pc-windows-msvc]
cc = "cl"
cxx = "cl"
cflags = []
cxxflags = []
ldflags = []

[native]
include = ["native/include"]
objects = ["native/build/sample.obj"]
libraries = []
